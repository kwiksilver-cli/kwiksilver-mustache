product:
  type: kmp/lib
  platforms: [jvm, android, macosArm64, iosArm64, iosSimulatorArm64, linuxX64, linuxArm64, mingwX64]

dependencies:
  - $kotlin.serialization.json

test-dependencies:
  - io.kotest:kotest-framework-engine:6.2.4
  - io.kotest:kotest-assertions-core:6.2.4
  - com.squareup.okio:okio:3.18.1

test-dependencies@jvm:
  - io.kotest:kotest-runner-junit5:6.2.4

settings:
  android:
    namespace: dev.kwiksilver.mustache
    compileSdk: 36
    minSdk: 24
  jvm:
    jdk:
      version: 21
    release: 17
  kotlin:
    version: 2.4.10
    serialization: json
  publishing:
    enabled: true
    group: dev.kwiksilver
    version: 0.2

repositories:
  - id: mavenCentral
    url: https://repo.maven.apache.org/maven2
  - id: github
    url: https://maven.pkg.github.com/kwiksilver-cli/kwiksilver-mustache
    publish: true
    credentials:
      file: creds.properties
      usernameKey: username
      passwordKey: password