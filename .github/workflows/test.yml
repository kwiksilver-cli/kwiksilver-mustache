name: Test

on:
  push:

jobs:
  test:
    strategy:
      matrix:
        os: [ macos-latest, windows-latest, ubuntu-latest ]
        include:
          - os: macos-latest
            TEST_PLATFORM: jvm macosArm64
          - os: windows-latest
            TEST_PLATFORM: mingwX64
          - os: ubuntu-latest
            TEST_PLATFORM: jvm linuxX64
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Install Kotlin Toolchain
        run: curl -fsSL https://kotl.in/install.sh | sh
      - name: Run tests
        run: |
          for platform in ${{matrix.TEST_PLATFORM}}; do
            kotlin test --platform "$platform"
          done
      - name: Bundle the build report
        if: failure()
        run: find . -type d -name 'reports' | zip -@ -r build-reports-${{matrix.os}}.zip
      - name: Upload the build report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: error-report-${{matrix.os}}
          path: build-reports-${{matrix.os}}.zip
